services:
  - type: web
    name: denos-api
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    rootDir: backend/LegacyOS.Api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: DATABASE_URL
        fromDatabase:
          name: denos-db
          property: connectionString
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Frontend__BaseUrl
        sync: false
      - key: Stripe__SecretKey
        sync: false
      - key: Stripe__WebhookSecret
        sync: false
      - key: BootstrapStaff__Email
        sync: false
      - key: BootstrapStaff__Password
        sync: false
      - key: Email__ResendApiKey
        sync: false
      - key: Email__From
        sync: false

  - type: web
    name: denos-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: denos-db
    databaseName: denos
    user: denos
    plan: 0.1c-256mb
    diskSizeGB: 5
    region: ohio
    ipAllowList: []
